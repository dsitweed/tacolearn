services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./shared/src:/app/shared/src
    env_file:
      - ./backend/.env
    depends_on:
      - database
    ports:
      - 3005:3000
    environment:
      - DATABASE_URL=postgresql://tacolearn:tacolearn123@database:5432/tacolearn

  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: tacolearn_postgres
    environment:
      POSTGRES_DB: tacolearn
      POSTGRES_USER: tacolearn
      POSTGRES_PASSWORD: tacolearn123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacolearn"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: tacolearn_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # # MinIO for local file storage (alternative to Cloudinary in development)
